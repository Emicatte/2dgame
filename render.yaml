# Render Blueprint for the game server + API and its PostgreSQL database.
# Applying a Blueprint creates billable resources: review plans in the Render dashboard first.
# Plan identifiers follow https://render.com/docs/blueprint-spec (verified November 2026).
services:
  - type: web
    name: scrapline-server
    runtime: docker
    dockerfilePath: ./docker/server.Dockerfile
    dockerContext: .
    # Frankfurt is Render's EU region (lowest latency for Italy / central Europe).
    region: frankfurt
    # One instance by design (see docs/ARCHITECTURE.md "Scaling"). Start small and watch CPU:
    # a tick that misses its 50 ms budget is felt by players before anything else.
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    # On deploys the old instance gets SIGTERM ~60 s after traffic moves to the new one, then this
    # delay before SIGKILL. The server drains (lets running matches finish) for SHUTDOWN_DRAIN_SEC.
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SHUTDOWN_DRAIN_SEC
        value: "270"
      - key: TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scrapline-db
          property: connectionString
      # The connection string from `fromDatabase` is Render's internal URL (private network, no
      # TLS offered). If you ever switch to the external URL, use verify-full + DATABASE_SSL_CA.
      - key: DATABASE_SSL
        value: disable
      # Render's load balancer is the single proxy hop in front of the service: trust exactly one
      # X-Forwarded-For entry for per-address rate limits (more would let clients spoof it).
      - key: TRUST_PROXY
        value: "1"
      # Comma separated, e.g. https://game.example.com,https://scrapline.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: scrapline-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: scrapline
    user: scrapline
    # Only services in the same Render workspace/private network can connect.
    ipAllowList: []
